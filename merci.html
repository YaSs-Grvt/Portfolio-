<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Message envoyé | Yacine Ben Omrane</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thanks { min-height: 100svh; display: grid; place-items: center; padding-block: 48px; }
    .thanks__box { max-width: 34em; display: grid; gap: 20px; justify-items: start; }
    .thanks h1 { font-size: var(--step-4); letter-spacing: -0.025em; line-height: 1.02; }
    .thanks p { color: var(--ink-2); font-size: var(--step-1); }
  </style>
</head>
<body>
  <main class="thanks wrap">
    <div class="thanks__box">
      <p class="status"><span class="status__dot" aria-hidden="true"></span>Message envoyé</p>
      <h1>Merci, votre message est bien arrivé.</h1>
      <p>Je vous réponds sous 24 à 48&nbsp;heures, à l'adresse e-mail que vous avez indiquée.</p>
      <a class="btn" href="index.html">Revenir au portfolio</a>
    </div>
  </main>
</body>
</html>
